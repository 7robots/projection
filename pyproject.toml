[project]
name = "projection"
version = "0.1.0"
description = "Terminal project manager with a local-first store and pluggable backends"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=8.2.8",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.scripts]
projection = "projection.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["projection"]
